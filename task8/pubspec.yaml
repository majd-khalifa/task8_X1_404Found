name: task8
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0
  video_player: ^2.8.6
  video_player_android: ^2.4.10
  dio: ^5.9.0
  bloc: ^9.2.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^10.7.0
  flutter_signin_button: ^2.0.0
  shared_preferences: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true 

  assets:
    - assets/images/

  fonts:
    - family: Be_Vietnam_Pro
      fonts:
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Bold.ttf
          weight: 700
