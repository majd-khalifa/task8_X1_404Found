name: task8
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.8.6
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Be_Vietnam_Pro
      fonts:
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Be_Vietnam_Pro/BeVietnamPro-Bold.ttf
          weight: 700
